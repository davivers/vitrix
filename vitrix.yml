schema_version: 1

# Onde ficam as regras Sigma, os casos de teste e a saída compilada.
rules_dir: rules
cases_dir: cases
output_dir: dist

# SIEMs ativos. `vitrix targets` lista os disponíveis (embutidos e de plugins).
targets:
  - splunk
  - kql
  - elastic-eql

# Linguagem final de cada regra, da mais específica para a mais geral:
#   1. `vitrix: {target: kql}` dentro da própria regra (string ou lista)
#   2. a primeira rota abaixo cujo `match` casa com o caminho dentro de rules/
#   3. `default_target`
#   4. sem nada disso, a regra é convertida para todos os `targets` ativos
default_target: splunk
routes: []
#  - match: "azure/*"
#    target: kql

# Pipelines do pySigma com o mapeamento de campos do SEU ambiente.
# Aplicados antes do mapeamento padrão de cada SIEM.
# extra_pipelines:
#   - pipelines/meu-ambiente.yml

# Exige arquivo de casos para cada regra, com ao menos um positivo e um negativo.
require_cases: true

# Pull requests abertos pela interface (botão "Abrir pull request" no Editor).
# O token vem do ambiente: VITRIX_GITHUB_TOKEN (ou GITHUB_TOKEN), com permissão de
# escrita em Contents e Pull requests. Nunca coloque o token neste arquivo.
# github:
#   repo: minha-org/deteccoes
#   base: main
#   path: ""        # pasta deste projeto dentro do repositório, se não for a raiz
