name: vitrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Testes do próprio motor e da API.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Lint e segurança
        run: |
          ruff check src tests
          bandit -c pyproject.toml -r src -q
      - run: pytest

  # Interface: tipos, build e conferência de que o build commitado está em dia.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: O build commitado em src/vitrix/ui está em dia?
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain src/vitrix/ui)" ]; then
            echo "Rode 'npm run build' em web/ e commite src/vitrix/ui/"
            git status --porcelain src/vitrix/ui
            exit 1
          fi

  # O próprio repositório de exemplo passa pelo pipeline do Vitrix:
  # lint, conversão para a linguagem final de cada regra e testes locais.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar o motor
        run: pip install .

      # Fluxo completo: lint, conversão, testes, replay e quality gate.
      # O resumo aparece na aba "Summary" da execução.
      - name: Validar
        run: vitrix check --strict --gate --markdown "$GITHUB_STEP_SUMMARY"

      - name: Relatório
        if: always()
        run: vitrix report -o vitrix-report.md || true

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrix-report
          path: vitrix-report.md

      - name: Guardar as queries compiladas
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
