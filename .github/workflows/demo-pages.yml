name: Demo (GitHub Pages)

# Public read-only demo (ADR 0003): static UI + JSON fixtures captured from a fresh `vitrix init`
# repository by the real app. No server, no secrets. Enable once: Settings -> Pages -> Source "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[api]" "httpx>=0.27" "httpx2>=2.16"
      - name: Capture fixtures from the real app
        run: python scripts/capture_demo_fixtures.py
      - name: Build the demo UI
        working-directory: web
        env:
          VITE_DEMO: "1"
          VITRIX_DEMO_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - name: SPA fallback for deep links
        run: cp build/demo/index.html build/demo/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
