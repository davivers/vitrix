name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tests of the engine and the API, plus lint and security.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Lint and security
        run: |
          ruff check src tests
          bandit -c pyproject.toml -r src -q
      - run: pytest

  # Web UI: types, build and a check that the committed build is up to date.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Is the committed build in src/vitrix/ui up to date?
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain src/vitrix/ui)" ]; then
            echo "Run 'npm run build' in web/ and commit src/vitrix/ui/"
            git status --porcelain src/vitrix/ui
            exit 1
          fi

  # What a USER gets: install the package (not the source tree), create a detections repository
  # with `vitrix init` and run the whole lifecycle in it. This repository holds the product, not
  # detections: the example rules ship inside the package as a template.
  user-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the built package
        run: |
          pip install build
          python -m build --wheel
          pip install "$(ls dist/*.whl)[api]"
      - name: Create a detections repository
        run: |
          vitrix init "$RUNNER_TEMP/my-detections"
          test -f "$RUNNER_TEMP/my-detections/.github/workflows/vitrix.yml"
      - name: Validate it like a user would
        working-directory: ${{ runner.temp }}/my-detections
        run: |
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm init
          vitrix check --strict --gate
          vitrix replay
      - name: The UI serves
        working-directory: ${{ runner.temp }}/my-detections
        run: |
          vitrix serve --port 8123 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8123/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8123/api/quality | grep -q '"ready":true'

  # The Docker image: builds from the committed UI, then runs the lifecycle inside the container
  # exactly as a user with a mounted detections repository would.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vitrix:ci .
      - run: docker run --rm vitrix:ci --help
      - name: Init and check inside the container
        run: |
          mkdir -p "$RUNNER_TEMP/det" && chmod 777 "$RUNNER_TEMP/det"
          docker run --rm -v "$RUNNER_TEMP/det:/workspace" vitrix:ci init .
          docker run --rm --entrypoint sh -v "$RUNNER_TEMP/det:/workspace" vitrix:ci -c             "git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm init"
          docker run --rm -v "$RUNNER_TEMP/det:/workspace" vitrix:ci check --strict --gate
      - name: The container serves and its healthcheck passes
        run: |
          docker run -d --name vx -p 127.0.0.1:8124:8000 -v "$RUNNER_TEMP/det:/workspace" vitrix:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8124/api/health && break; sleep 1; done
          curl -sf http://localhost:8124/ | grep -q '<div id="root">'
          docker exec vx python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
