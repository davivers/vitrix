# Example: run Vitrix on a detections repository in ./detections
#   docker compose run --rm vitrix init .      # first time: create the repo layout
#   docker compose up                          # UI on http://localhost:8000
services:
  vitrix:
    build: .
    # The port is published on the loopback interface ONLY. The image turns accounts on, but whoever
    # reaches the port first with the setup link owns the workspace: never change this to "8000:8000" or 0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./detections:/workspace      # rules, cases, datasets, vitrix.yml and .vitrix/ (accounts, drafts)
    environment:
      # Read from your shell / .env, never baked into the image.
      - VITRIX_GITHUB_TOKEN
    # The image sets VITRIX_AUTH=on (accounts + Save locally work in a container) and
    # VITRIX_BOOTSTRAP_TOKEN=auto: `docker compose logs` prints a one-time setup link to create the owner.
    # Override here if needed:
    #   - VITRIX_AUTH=off                       # not recommended
    #   - VITRIX_BOOTSTRAP_TOKEN=<16+ chars>    # fixed setup token (never printed); empty = first account wins
    # Behind a reverse proxy with a real hostname: enable auth in vitrix.yml and add
    #   - VITRIX_ALLOWED_HOSTS=vitrix.example.com
    restart: unless-stopped
