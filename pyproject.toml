[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrix"            # nome ok; falta checar marca e domínio
version = "0.1.0"
description = "Detection-as-Code: valida, converte e testa regras Sigma sem precisar de um SIEM"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
keywords = ["sigma", "detection-as-code", "siem", "detection-engineering", "security", "threat-detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "pysigma>=1.0",
  "pysigma-backend-splunk>=2.0",
  "pysigma-backend-kusto>=1.0",
  "pysigma-backend-elasticsearch>=2.0",
  "pysigma-pipeline-windows>=2.0",
  "pysigma-pipeline-sysmon>=2.0",
  "pyyaml>=6.0",
  "regex>=2023.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "ruff>=0.6", "bandit>=1.7"]

[project.urls]
Homepage = "https://github.com/davivers/vitrix"
Repository = "https://github.com/davivers/vitrix"
Issues = "https://github.com/davivers/vitrix/issues"

[project.scripts]
vitrix = "vitrix.cli:main"

# Plugins de terceiros registram novos alvos de SIEM assim, no pyproject deles:
#
#   [project.entry-points."vitrix.targets"]
#   meu-siem = "meu_pacote.alvo:target"
#
# onde `target` é um objeto vitrix.backends.Target (ou uma função que devolve um).

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitrix = ["ui/**", "template/**", "data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["src/vitrix/ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM105"]

[tool.bandit]
exclude_dirs = ["tests", "src/vitrix/ui"]
