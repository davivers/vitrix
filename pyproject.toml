[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrix"            # nome ok; falta checar marca e domínio
version = "0.1.0"
description = "Detection-as-Code: valida, converte e testa regras Sigma sem precisar de um SIEM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pysigma>=1.0",
  "pysigma-backend-splunk>=2.0",
  "pysigma-backend-kusto>=1.0",
  "pysigma-backend-elasticsearch>=2.0",
  "pysigma-pipeline-windows>=2.0",
  "pysigma-pipeline-sysmon>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
vitrix = "vitrix.cli:main"

# Plugins de terceiros registram novos alvos de SIEM assim, no pyproject deles:
#
#   [project.entry-points."vitrix.targets"]
#   meu-siem = "meu_pacote.alvo:target"
#
# onde `target` é um objeto vitrix.backends.Target (ou uma função que devolve um).

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitrix = ["ui/*", "ui/assets/*", "template/*", "template/*/*", "template/*/*/*", "template/*/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["src/vitrix/ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM105"]

[tool.bandit]
exclude_dirs = ["tests", "src/vitrix/ui"]
